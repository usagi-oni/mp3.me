<!DOCTYPE html>
<html lang="en">

<head>
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTEN NOW ♫</title>
</head>

<body>

<section>
    <div class="title-bar">
       <div class="mp3-txt"> Welcome to MP3ME!!! </div>

    <div class="title-bar-controls">
        <button class="min" onclick="alert('I SEE YOU!!')"></button>
        <button class="max" onclick="alert('STOP CLICKING!!!')" ></button>
        <button class="close" onclick="alert('FINE WTV!!')"></button>
    </div>
  </div>
</section>

<section>
    <div class="mp3-window">

  <div class="cd" id="cd">
    <div class="hole"></div>
  </div>

<div class="main-player"></div>

 <select class="track-selection"></select>
  <div class="timer">00:00</div>
  <div class="duration">0:00</div>

<input type="range" min="0" max="100" value="0" class="seek-slide">

 <div class="volume-control">
  🎶
  <input type="range" min="0" max="1" step="0.01" value="1" class="volume">
</div>

  <div class="controllers">
    <button onclick="prevTrack()">⏮</button>
    <button onclick="playpauseTrack()">⭐</button>
    <button onclick="nextTrack()">⏭</button>
    <button onclick="toggleShuffle()">🎲</button>
  </div>
</div>
</section>

<section>
    <audio id="audio"></audio>
</section>

<script>
    const audio = document.getElementById("audio");
    const dropdown = document.querySelector(".track-selection");
    const seekSlider = document.querySelector(".seek-slide");
    const timer = document.querySelector(".timer");
    const duration = document.querySelector(".duration");
    const cd = document.getElementById("cd");
    const volumeSlider = document.querySelector(".volume");

    let track_list = [
        { name: "Spooks", path: "musica/Spooks.mp3"},
        { name: "RUSH", path: "musica/RUSH.mp3"}

    ];

let track_index = 0;
let isPlaying = false;
let isShuffle = false;

function loadTrack(index) {
  audio.src = track_list[index].path;
  audio.load();
  dropdown.value = index;
}

function playpauseTrack() {
  if (!isPlaying) {
    audio.play();
    isPlaying = true;
  } else {
    audio.pause();
    isPlaying = false;
  }
}

function nextTrack() {
    if (isShuffle) return shuffleTrack();
    track_index = (track_index + 1) % track_list.length;
    loadTrack(track_index);
    audio.play();
    isPlaying = true;
    }

function prevTrack() {
  track_index = (track_index - 1 + track_list.length) % track_list.length;
  loadTrack(track_index);
  audio.play();
  isPlaying = true;
}

function shuffleTrack() {
  let newIndex;

  do {
    newIndex = Math.floor(Math.random() * track_list.length);
  } while (newIndex === track_index);

  track_index = newIndex;
  loadTrack(track_index);
  audio.play();
  isPlaying = true;
}

function toggleShuffle() {
  isShuffle = !isShuffle;
  alert("Shuffle " + (isShuffle ? "ON" : "OFF"));
}

audio.addEventListener("timeupdate", () => {

  let current = audio.currentTime;
  let total = audio.duration;

  if (!isNaN(total)) {

    seekSlider.value = (current / total) * 100;

    let curMin = Math.floor(current / 60);
    let curSec = Math.floor(current % 60);

    let durMin = Math.floor(total / 60);
    let durSec = Math.floor(total % 60);

    timer.textContent =
      `${curMin}:${curSec.toString().padStart(2, "0")}`;

    duration.textContent =
      `${durMin}:${durSec.toString().padStart(2, "0")}`;
  }
});

seekSlider.addEventListener("input", () => {

  audio.currentTime =
    (seekSlider.value / 100) * audio.duration;
});

track_list.forEach((track, index) => {
  let option = document.createElement("option");
  option.value = index;
  option.textContent = track.name;
  dropdown.appendChild(option);
});

dropdown.addEventListener("change", function () {
  track_index = Number(this.value);
  loadTrack(track_index);
  audio.play();
  isPlaying = true;
});


audio.addEventListener("play", () => {

  console.log("audio is playing");

  cd.classList.add("spin");
});

audio.addEventListener("pause", () => {

  cd.classList.remove("spin");
});

audio.addEventListener("ended", () => {

  cd.classList.remove("spin");
});

audio.volume = 1;
volumeSlider.value = 1;

volumeSlider.addEventListener("input", () => {
  audio.volume = Number(volumeSlider.value);
});

loadTrack(track_index);
</script>
    
</body>

</html>
